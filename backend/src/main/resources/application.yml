spring:
  application:
    name: project-management
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:project_management}
    username: ${POSTGRES_USER:project_manager}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  server-credential:
    # 生产环境必须通过环境变量提供 32 字节随机密钥的 Base64，禁止写入配置文件。
    master-key: ${SERVER_CREDENTIAL_MASTER_KEY:}
    key-version: ${SERVER_CREDENTIAL_KEY_VERSION:v1}
  file-storage:
    root: ${FILE_STORAGE_ROOT:./data/files}
    chunk-size-bytes: ${FILE_CHUNK_SIZE_BYTES:5242880}
  bootstrap-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME:系统管理员}
