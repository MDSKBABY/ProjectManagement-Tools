spring:
  application:
    name: project-management
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:project_management}
    username: ${POSTGRES_USER:project_manager}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

mybatis-flex:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  bootstrap-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    display-name: ${INITIAL_ADMIN_DISPLAY_NAME:系统管理员}
